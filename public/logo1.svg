<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F6E27A;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B89535;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.3"/>

  <!-- Inner decorative circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldGradient)" stroke-width="1" opacity="0.2"/>

  <!-- Main circle background -->
  <circle cx="100" cy="100" r="75" fill="rgba(10, 10, 10, 0.8)" stroke="url(#goldGradient)" stroke-width="3"/>

  <!-- Letter E -->
  <text x="100" y="120" font-family="'Playfair Display', serif" font-size="90" font-weight="bold"
        fill="url(#goldGradient)" text-anchor="middle" filter="url(#glow)">E</text>

  <!-- Decorative elements -->
  <path d="M 40 100 L 60 100" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6"/>
  <path d="M 140 100 L 160 100" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6"/>

  <!-- Small dots -->
  <circle cx="35" cy="100" r="2" fill="url(#goldGradient)" opacity="0.8"/>
  <circle cx="165" cy="100" r="2" fill="url(#goldGradient)" opacity="0.8"/>
</svg>
